services:
  discovery-service:
    build: .
    # ports: needs a literal port number and STOP_GRACE_PERIOD is a pure
    # Docker directive the app never reads — those two are the only
    # places this file supplies its own fallback. Every other value below
    # is passed through as-is: if it's set in .env, that value is used;
    # if it's unset, the Go binary applies its own default from
    # internal/config/config.go — one source of truth for "what happens
    # when unset", not two that can drift apart.
    ports:
      - "${HOST_PORT:-8090}:${PORT:-8080}"
    environment:
      PORT: ${PORT}
      DISPATCH_CLIENT_TIMEOUT_SECONDS: ${DISPATCH_CLIENT_TIMEOUT_SECONDS}
      DISPATCH_DELIVERY_TIMEOUT_SECONDS: ${DISPATCH_DELIVERY_TIMEOUT_SECONDS}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE}
      WORKER_QUEUE_SIZE: ${WORKER_QUEUE_SIZE}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
      HTTP_READ_HEADER_TIMEOUT_SECONDS: ${HTTP_READ_HEADER_TIMEOUT_SECONDS}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS}
      HTTP_IDLE_TIMEOUT_SECONDS: ${HTTP_IDLE_TIMEOUT_SECONDS}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      BPP_ID: ${BPP_ID}
      BPP_URI: ${BPP_URI}
      ON_DISCOVER_PATH: ${ON_DISCOVER_PATH}
      SIGNING_PRIVATE_KEY_BASE64: ${SIGNING_PRIVATE_KEY_BASE64}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID}
      SIGNING_VALIDITY_SECONDS: ${SIGNING_VALIDITY_SECONDS}
      CATALOG_SOURCE_URLS: ${CATALOG_SOURCE_URLS}
      CATALOG_REFRESH_INTERVAL_SECONDS: ${CATALOG_REFRESH_INTERVAL_SECONDS}
      CATALOG_FETCH_TIMEOUT_SECONDS: ${CATALOG_FETCH_TIMEOUT_SECONDS}
      CATALOG_SOURCE_MODE: ${CATALOG_SOURCE_MODE}
      DEDI_FIXTURE_PATH: ${DEDI_FIXTURE_PATH}
      DEDI_REGISTRY_MODE: ${DEDI_REGISTRY_MODE}
      DEDI_REGISTRY_URL: ${DEDI_REGISTRY_URL}
      DEDI_SUBSCRIBER_REFS: ${DEDI_SUBSCRIBER_REFS}
      DEDI_NETWORK_IDS: ${DEDI_NETWORK_IDS}
      DEDI_SCHEMA_TYPES: ${DEDI_SCHEMA_TYPES}
      DEDI_CUTOVER_FRACTION: ${DEDI_CUTOVER_FRACTION}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST}
      MATCH_TIMEOUT_MILLISECONDS: ${MATCH_TIMEOUT_MILLISECONDS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: ${STOP_GRACE_PERIOD:-20s}
    networks:
      - beckn

networks:
  beckn:
    external: true
    name: beckn-app_beckn
